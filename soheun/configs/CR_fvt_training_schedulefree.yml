experiment_name: CR_fvt_training_schedulefree_ablation2
dataset:
  signal_filename: HH4b_picoAOD.h5
  signal_ratio: 0.0
  n_3b: 100_0000
  ratio_4b: 0.5
  seed: 0
  base_fvt_train_ratio: 0.5
signal_region:
  4b_in_SR: 0.05
  4b_in_CR: 0.95
CR_fvt:
  model: FvTClassifier
  dim_dijet_features: 6
  dim_quadjet_features: 6 
  depth:
    encoder: 4
    decoder: 1
  fit_batch_size: 1024
  model_seed: 0
  train_seed: 0 
  data_seed: 0
  max_epochs: 100
  val_ratio: 0.33
  early_stop_patience: null
  optimizer:
    type: AdamWScheduleFree
    lr: 0.01
    warmup_steps: 0
  lr_scheduler:
    type: ReduceLROnPlateau
    factor: 0.5
    threshold: 0.0001
    patience: 10
    cooldown: 1
    min_lr: 0.0002
    # type: none
  dataloader:
    batch_size: 8192
    batch_size_multiplier: 2
    batch_size_milestones: []
    # batch_size_milestones: [1, 3, 6, 10, 15]
  encoder_mode: best
